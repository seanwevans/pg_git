name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must run before anything else invokes make: `make` regenerates
      # sql/pg_git--<version>.sql in place, so a build step would quietly repair
      # a hand-edited or un-regenerated file and the drift would never surface.
      - name: Check generated SQL is in sync with its fragments
        run: make check-generated
      - name: Build and install extension
        run: |
          make
          sudo make install
      - name: Run core tests
        run: |
          docker compose up --abort-on-container-exit --exit-code-from test test

  test-slow-suites:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and install extension
        run: |
          make
          sudo make install
      - name: Run integration and performance suites
        run: |
          docker compose run --rm -e RUN_INTEGRATION=1 -e RUN_PERF=1 test make test-all
